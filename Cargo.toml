[package]
name = "turtle-devtools"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.41.0", features = ["macros", "rt-multi-thread", "process", "sync", "fs", "time"] }
clap = { version = "4.5.2", features = ["derive"] }
colored = "2.0"
toml = "0.8.19"
serde = { version = "1.0.213", features = ["derive"] }
dotenv = "0.15.0"
ssh2 = "0.9.4"
async-trait = "0.1.83"
async_ftp = { version = "6.0.0", features = ["tokio-rustls"] }
async-recursion = "1.1.1"
futures = "0.3.31"
thiserror = "1.0.65"
anyhow = "1.0.91"
notify = "7.0.0"

swc_bundler = "5.0.0"
swc_common = { version = "4.0.1", features = ["tty-emitter"] }
swc_ecma_parser = "5.0.0"
swc_ecma_codegen = "4.0.2"
swc_ecma_ast = "4.0.1"
swc_ecma_loader = { version = "4.0.0", features = ["node", "cache"] }
swc = "5.0.2"
swc_ecma_transforms_typescript = "4.0.0"
swc_ecma_visit = "4.0.0"
lru = "0.12.5"
parking_lot = "0.12.3"

grass = "0.13.4"
ignore = "0.4.23"